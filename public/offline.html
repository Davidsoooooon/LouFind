<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#073779" />
    <title>LouFind · SLU Baguio · Offline</title>
    <style>
      body {
        font: 16px system-ui;
        background: #fff;
        color: #18273e;
        max-width: 420px;
        margin: 18vh auto;
        padding: 24px;
        line-height: 1.7;
        text-align: center;
      }
      img {
        width: 200px;
        max-width: 100%;
        height: auto;
      }
      h1 {
        font-size: 28px;
      }
      button {
        padding: 13px 20px;
        background: #073779;
        color: white;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #073779;
        outline-offset: 4px;
      }
      p {
        color: #52627a;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/brand/loufind-logo.webp"
        alt="LouFind — SLU Lost &amp; Found"
        width="1330"
        height="1182"
      />
      <h1>You’re offline</h1>
      <p>
        Your saved demo reports are still on this device. Reconnect to open
        LouFind.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
